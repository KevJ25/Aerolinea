<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bitácora · Sistema de Gestión de Aerolínea</title>
        <link rel="icon" href="/recursos/icono.svg" />
        <link rel="stylesheet" href="/recursos/estilos.css" />
        <script type="module" src="/recursos/admin-bitacora.js"></script>
    </head>
    <body>
        <main class="principal">
            <h1 class="titulo-pagina">Bitácora de operaciones</h1>
            <p class="nota">
                Toda alta, modificación, baja y acceso queda registrada con usuario, fecha, hora y
                módulo (RF-17). Los registros no se pueden modificar ni borrar.
            </p>
            <div id="mensaje" class="oculto"></div>
            <form id="filtros" class="filtros" role="search">
                <div class="campo">
                    <label for="accion">Acción</label>
                    <select id="accion" name="accion">
                        <option value="">Todas las acciones</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="modulo">Módulo</label>
                    <select id="modulo" name="modulo">
                        <option value="">Todos los módulos</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="desde">Desde</label>
                    <input id="desde" name="desde" type="date" />
                </div>
                <div class="campo">
                    <label for="hasta">Hasta</label>
                    <input id="hasta" name="hasta" type="date" />
                </div>
                <button class="boton boton--secundario" type="submit">Filtrar</button>
            </form>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Fecha y hora</th>
                            <th scope="col">Usuario</th>
                            <th scope="col">Acción</th>
                            <th scope="col">Módulo</th>
                            <th scope="col">Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="filas"></tbody>
                </table>
            </div>
            <div class="paginacion">
                <button id="anterior" class="boton boton--secundario boton--chico" type="button">
                    Anterior
                </button>
                <span id="pagina" class="nota"></span>
                <button id="siguiente" class="boton boton--secundario boton--chico" type="button">
                    Siguiente
                </button>
            </div>
        </main>
    </body>
</html>
