<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mi cuenta · Sistema de Gestión de Aerolínea</title>
        <link rel="icon" href="/recursos/icono.svg" />
        <link rel="stylesheet" href="/recursos/estilos.css" />
        <script type="module" src="/recursos/inicio.js"></script>
    </head>
    <body>
        <main class="principal">
            <h1 class="titulo-pagina" id="saludo">Mi cuenta</h1>
            <div class="rejilla-2">
                <section class="tarjeta" aria-labelledby="t-datos">
                    <h2 id="t-datos">Datos de la cuenta</h2>
                    <dl class="datos">
                        <dt>Nombre</dt>
                        <dd id="d-nombre"></dd>
                        <dt>Correo</dt>
                        <dd id="d-correo"></dd>
                        <dt>Perfil</dt>
                        <dd id="d-rol"></dd>
                        <dt>Alta</dt>
                        <dd id="d-alta"></dd>
                    </dl>
                </section>
                <section class="tarjeta" aria-labelledby="t-contrasena">
                    <h2 id="t-contrasena">Cambiar contraseña</h2>
                    <form id="formulario" class="formulario" novalidate>
                        <div id="mensaje" class="oculto"></div>
                        <div class="campo">
                            <label for="actual">Contraseña actual</label>
                            <input
                                id="actual"
                                name="actual"
                                type="password"
                                autocomplete="current-password"
                                required
                            />
                        </div>
                        <div class="campo">
                            <label for="nueva">Contraseña nueva</label>
                            <input
                                id="nueva"
                                name="nueva"
                                type="password"
                                autocomplete="new-password"
                                maxlength="128"
                                required
                            />
                        </div>
                        <ul id="politica" class="politica"></ul>
                        <div class="campo">
                            <label for="confirmacion">Confirmar contraseña nueva</label>
                            <input
                                id="confirmacion"
                                name="confirmacion"
                                type="password"
                                autocomplete="new-password"
                                maxlength="128"
                                required
                            />
                        </div>
                        <button class="boton" type="submit">Actualizar contraseña</button>
                    </form>
                </section>
            </div>
        </main>
    </body>
</html>
