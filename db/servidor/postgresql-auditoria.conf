# =============================================================================
# Configuración del servidor PostgreSQL para auditoría · Manual MC-SGA-001
# Se carga en Docker mediante db/servidor/Dockerfile y en servidores Debian/Ubuntu
# copiándola a /etc/postgresql/16/main/conf.d/. Requiere reiniciar el servidor.
# Las POLÍTICAS de auditoría no viven aquí: están versionadas en
# db/migrations/006_politicas_auditoria.sql para que su historia sea trazable.
# =============================================================================

# pgAudit debe cargarse al arrancar el servidor
shared_preload_libraries = 'pgaudit'

# Registro a archivo dentro del directorio de datos. Permite leer la auditoría
# con pg_read_file() desde una cuenta administrativa (lo usan las pruebas).
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_file_mode = 0600

# Cada línea identifica momento, proceso, cuenta, base de datos, aplicación y origen
log_line_prefix = '%m [%p] usuario=%u bd=%d app=%a cliente=%h '
log_connections = on
log_disconnections = on
log_timezone = 'America/Mexico_City'
